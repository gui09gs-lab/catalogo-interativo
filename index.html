<style>
:root{
  --red:#E30512; --red-dk:#B5040E; --bg:#EDEDEB; --panel:#FFFFFF; --sunk:#F5F5F3; --ink:#1B1C1E; --muted:#5F6166; --line:#D9D9D5;
  --char:#1B1C1E; --crit:#B3261E; --crit-soft:#FBE5E3;
  --f:"Montserrat","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#FF3D46; --red-dk:#E30512; --bg:#121314; --panel:#1C1D20; --sunk:#17181A; --ink:#EDEDED; --muted:#A3A6AB; --line:#303237;
  --char:#0B0B0C; --crit:#F2766C; --crit-soft:#3A1715; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --red:#FF3D46; --red-dk:#E30512; --bg:#121314; --panel:#1C1D20; --sunk:#17181A; --ink:#EDEDED; --muted:#A3A6AB; --line:#303237;
  --char:#0B0B0C; --crit:#F2766C; --crit-soft:#3A1715; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
header{position:relative;background:#fff;height:96px;overflow:hidden;padding-top:env(safe-area-inset-top)}
header .k{position:absolute;left:20px;top:calc(18px + env(safe-area-inset-top));height:28px}
header .t{position:absolute;left:20px;top:calc(58px + env(safe-area-inset-top));margin:0;font-weight:800;font-size:13px;letter-spacing:.06em;color:#E30512;border-left:3px solid #E30512;padding-left:9px;text-transform:uppercase}
header .stripe{position:absolute;right:0;top:0;bottom:0;width:180px;background:#E30512;clip-path:polygon(34% 0,100% 0,100% 100%,0 100%)}
header .stripe:before{content:"";position:absolute;inset:0;background:#1B1C1E;clip-path:polygon(28% 0,34% 0,0 100%,-6% 100%)}
header .f{position:absolute;right:14px;top:calc(36px + env(safe-area-inset-top));height:20px}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--red)}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.card h1{margin:0;background:var(--char);color:#fff;font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:18px 22px}
.card form{padding:22px}
.card p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:3px;background:var(--sunk);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--red);outline-offset:1px}
.lembrar{display:flex;gap:8px;align-items:center;margin:14px 0 20px;font-size:14px;color:var(--ink);font-weight:500}
.lembrar input{accent-color:var(--red);width:18px;height:18px;margin:0}
button{width:100%;font:inherit;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;background:var(--red);color:#fff;border:0;border-radius:3px;padding:14px;cursor:pointer}
button:hover{background:var(--red-dk)}
button:disabled{opacity:.6;cursor:wait}
.erro{display:none;margin-top:14px;padding:10px 12px;font-size:13px;background:var(--crit-soft);color:var(--crit);border-radius:3px}
.erro.on{display:block}
.carregando{display:none;padding:40px 22px;text-align:center;color:var(--muted);font-size:14px}
body.abrindo form{display:none}
body.abrindo .carregando{display:block}
footer{text-align:center;font-size:12px;color:var(--muted);padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
</style>
</head>

      <label for="pw">Senha</label>
      <input type="password" id="pw" name="password" autocomplete="current-password" required>

<script>
(function(){
  "use strict";
  var CHAVE = "kw-chave-v1";
  var ITER = 300000;

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
  // O evento de instalação pode chegar antes do login; guardamos para o banner do catálogo usar depois.
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); window.__kwInstalar = e; });

  function ler(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function gravar(k, v){ try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} }
  function b64(buf){ return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function deb64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }

  var pacote = null;
  function baixar(){
    if (!pacote) {
      pacote = fetch("catalogo.enc").then(function(r){
        if (!r.ok) throw new Error("http " + r.status);
        return r.arrayBuffer();
      }).then(function(buf){
        var u = new Uint8Array(buf);
        if (String.fromCharCode(u[0], u[1], u[2]) !== "KW1") throw new Error("formato");
        return { sal: u.slice(3, 19), iv: u.slice(19, 31), dados: u.slice(31) };
      });
      pacote.catch(function(){ pacote = null; });
    }
    return pacote;
  }

  function derivar(senha, sal){
    var enc = new TextEncoder().encode(senha);
    return crypto.subtle.importKey("raw", enc, "PBKDF2", false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: sal, iterations: ITER, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }

  function abrir(chave, p){
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: p.iv }, chave, p.dados).then(function(zip){
      var fluxo = new Blob([zip]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new Response(fluxo).text();
    }).then(function(html){
      document.open(); document.write(html); document.close();
    });
  }

  var form = document.getElementById("f"), btn = document.getElementById("btn"), erro = document.getElementById("erro");
  function mostrarErro(msg){ document.body.classList.remove("abrindo"); erro.textContent = msg; erro.classList.add("on"); btn.disabled = false; }

  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") {
    mostrarErro("Este navegador é antigo demais para abrir o catálogo. Atualize o Chrome, o Edge ou o Safari.");
    btn.disabled = true;
    return;
  }

  // Chave lembrada: abre direto, sem pedir senha.
  var salva = ler(CHAVE);
  if (salva) {
    document.body.classList.add("abrindo");
    baixar().then(function(p){
      return crypto.subtle.importKey("raw", deb64(salva), "AES-GCM", false, ["decrypt"]).then(function(k){ return abrir(k, p); });
    }).catch(function(e){
      if (e && e.name === "OperationError") { gravar(CHAVE, null); mostrarErro("A senha mudou. Digite a senha nova."); }
      else mostrarErro("Não foi possível carregar o catálogo. Verifique a conexão e tente de novo.");
    });
  }

  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    erro.classList.remove("on"); btn.disabled = true;
    document.body.classList.add("abrindo");
    var senha = document.getElementById("pw").value;
    baixar().then(function(p){
      return derivar(senha, p.sal).then(function(k){
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: p.iv }, k, p.dados).then(function(){
          if (document.getElementById("lembrar").checked) {
            return crypto.subtle.exportKey("raw", k).then(function(raw){ gravar(CHAVE, b64(raw)); }).then(function(){ return k; });
          }
          return k;
        });
      }).then(function(k){ return abrir(k, p); });
    }).catch(function(e){
      if (e && e.name === "OperationError") mostrarErro("Senha incorreta.");
      else mostrarErro("Não foi possível carregar o catálogo. Verifique a conexão e tente de novo.");
    });
  });
})();
</script>
